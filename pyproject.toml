[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Clean, zero-bloat Enterprise Agentic RAG with Gemini Embedding 2, Qdrant Cloud, Gemini 3.5/3.1 Flash-Lite, and Pydantic Logfire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0.0",
    "qdrant-client>=1.12.0",
    "logfire>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.logfire]
ignore_no_config = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
